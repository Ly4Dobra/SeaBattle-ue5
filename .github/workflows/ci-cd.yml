name: UE5 CI/CD Pipeline

on:
  # 1. Запуск тестов при создании/обновлении Pull Request в ветку main
  pull_request:
    branches: [ main ]
  # 2. Финальный деплой и репликация после слияния PR в main
  push:
    branches: [ main ]

jobs:
  # =========================================================================
  # СТАДИЯ 1: ЛИНТЕР И СТАТИЧЕСКИЙ АНАЛИЗ (Выполняется на сервере Proxmox)
  # =========================================================================
  lint_and_sonar:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, server-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Clang-Format Linter
        run: |
          echo "Проверка стиля кода..."
          find Source/ -iname "*.h" -o -iname "*.cpp" | xargs clang-format --dry-run --Werror

      # Здесь в будущем настраивается SonarQube Scanner через Docker / CLI
      - name: Run SonarQube Analysis
        run: |
          echo "Запуск анализа SonarQube..."
          sonar-scanner -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.host.url=http://192.168.3.202:9000

  # =========================================================================
  # СТАДИЯ 2: ТЯЖЕЛЫЕ ТЕСТЫ UNREAL ENGINE 5 (Выполняется на вашем рабочем ПК)
  # =========================================================================
  unreal_gpu_tests:
    needs: lint_and_sonar # Запустится ТОЛЬКО если линтер на сервере прошёл успешно
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, gpu-runner]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run UE5 Automation and Graphics Tests
        shell: powershell
        run: |
          
          echo "Линтер пройден. Запуск тестов на ПК разработки..."
          # Замените путь к движку и название вашего .uproject файла
          & "C:\Program Files\UE\UE_5.5\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "${{ github.workspace }}\SeaBattle.uproject" -ExecCmds="Automation RunTests Project.AllTests" -stdout -LOG="ue5_tests.log" -NoLoadingScreen -NoLoadingScreen -WorkerThreadCount=4
          
      - name: Upload Test Logs for Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ue5-test-reports
          path: Saved/Automation/Report/

  # =========================================================================
  # СТАДИЯ 3: СБОРКА, ДЕПЛОЙ В NEXUS И ЗЕРКАЛИРОВАНИЕ (Только после Merge в main)
  # =========================================================================
  build_deploy_and_mirror:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gpu-runner] # Сборку (Package) делает мощный ПК
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Качаем всю историю для корректного пуша в зеркало

      - name: Build UE5 Project Package
        shell: powershell
        run: |
          
          echo "PR успешно влит в main! Собираем релизный пакет..."
          # 1. Создаем чистую фиксированную папку прямо на диске C:\
          if (Test-Path "C:\UE5_BuildOutput") { Remove-Item -Recurse -Force "C:\UE5_BuildOutput" }
          New-Item -ItemType Directory -Force -Path "C:\UE5_BuildOutput"
          
          # 2. Ищем файл .uproject, где бы он ни лежал (решает проблему двойных папок)
          $uprojectPath = (Get-ChildItem -Filter "SeaBattle.uproject" -Recurse | Select-Object -First 1).FullName
          echo "Найден проект по адресу: $uprojectPath"
          
          # 3. НАДЕЖНЫЙ ЗАПУСК СБОРКИ ЧЕРЕЗ START-PROCESS (Решает проблему пробелов в путях Epic Games)
          echo "Инициализация RunUAT..."
          
          # Задаем аргументы строго как единый массив строк (здесь кавычки внутри путей больше не нужны!)
          $uatArgs = @(
              "BuildCookRun",
              "-project=$uprojectPath",
              "-platform=Win64",
              "-clientconfig=Shipping",
              "-archive=C:\UE5_BuildOutput",
              "-build", "-cook", "-stage", "-archive", "-nocompileeditor",
              "-maxXGEJobs=8",
              "-UBTArgs=-MaxProcessorCount=8"
          )
          
          # Запускаем процесс, скрывая баг путей, и принудительно ждем его завершения (-Wait)
          # Проверьте, что путь к RunUAT.bat на вашем ПК совпадает!
          $uatProcess = Start-Process -FilePath "C:\Program Files\Epic Games\UE_5.5\Engine\Build\BatchFiles\RunUAT.bat" -ArgumentList $uatArgs -NoNewWindow -PassThru -Wait
          
          # Проверяем, как завершился процесс сборки движка
          if ($uatProcess.ExitCode -ne 0) {
              Write-Error "Сборка Unreal Engine завершилась ошибкой! Код выхода: $($uatProcess.ExitCode)"
              exit 1
          }

      - name: Archive and Upload to Nexus
        shell: powershell
        run: |
          
          echo "Архивация билда и отправка в Nexus Repository..."
          
          # Упаковываем файлы из нашего фиксированного пути C:\UE5_BuildOutput
          Compress-Archive -Path "C:\UE5_BuildOutput\*" -DestinationPath "${{ github.workspace }}\build.zip" -Force
          
          # Отправка в raw-репозиторий в Nexus
          curl -v -u "admin:${{ secrets.NEXUS_PASSWORD }}" --upload-file "${{ github.workspace }}\build.zip" "http://192.168.3.{{ github.run_number }}.zip"
          
          # Чистим за собой временный zip-файл на ПК
          Remove-Item -Force "${{ github.workspace }}\build.zip"
          
          if (Test-Path "C:\UE5_BuildOutput") { Remove-Item -Recurse -Force "C:\UE5_BuildOutput" }
          
      # === ВОТ ЭТАП ЗЕРКАЛИРОВАНИЯ КОДА НА ВАШ СЕРВЕР PROXMOX ===
      - name: Mirror Repository to Local Server
        shell: powershell
        run: |
          
          echo "Репликация стабильного кода в локальный Git-сервер на Proxmox..."
          # Проверяем, добавлен ли уже удаленный сервер, если нет — добавляем
          if (-not (git remote | Select-String "local_backup")) {
              git remote add local_backup "github@192.168.3.201:/var/git/SeaBattle.git"
          }
          # Пушим ветку main в локальную копию
          git push local_backup main --force
